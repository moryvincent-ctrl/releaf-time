name: Mirror to org
on:
  push:
    branches: ['**']

jobs:
  mirror:
    # Ce workflow fait partie des fichiers recopiés sur le miroir. Sans ce garde-fou
    # il se redéclenche donc sur ReleafCarbon/ReleafTime à chaque push reçu — où le
    # secret MIRROR_SSH_KEY n'existe pas — et échoue systématiquement avec
    # "Permission denied (publickey)" puis exit 128. On ne mirroite que depuis la source.
    if: github.repository == 'moryvincent-ctrl/releaf-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Push mirror
        run: |
          git remote add mirror git@github.com:ReleafCarbon/ReleafTime.git
          git push mirror --all --force
          git push mirror --tags --force
